<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Boletas - Silicon Ventas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #f1f5f9; --panel: #fff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --brand: #2563eb; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        
        /* Logo principal */
        .main-logo { width: 64px; height: 64px; object-fit: contain; display: block; margin: 0 auto 15px; }
        
        /* Tarjeta de Validación DNI */
        .auth-card { background: var(--panel); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.05); text-align: center; }
        .auth-card h1 { margin: 0 0 10px; font-size: 22px; }
        .auth-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
        .auth-card input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 18px; text-align: center; letter-spacing: 2px; margin-bottom: 15px; outline: none; }
        .auth-card input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
        .auth-card button { width: 100%; padding: 14px; background: var(--brand); color: #fff; border: 0; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .auth-card button:hover { background: #1d4ed8; }
        .error-msg { color: #dc2626; font-size: 13px; margin-top: 15px; display: none; }

        /* Tarjeta de Lista de Boletas */
        .list-card { background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.05); display: none; }
        .list-card h2 { margin: 0 0 15px; font-size: 18px; text-align: center; }
        .venta-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .venta-item:hover { background: #f8fafc; border-color: var(--brand); }
        .venta-info strong { display: block; font-size: 14px; color: var(--ink); margin-bottom: 4px; }
        .venta-info span { font-size: 12px; color: var(--muted); }
        .venta-precio { font-weight: 700; font-size: 14px; color: var(--brand); }

        /* Tarjeta de Boleta Individual */
        .boleta-card { background: var(--panel); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.05); font-family: 'Courier New', monospace; color: #111; display: none; }
        .boleta-head { text-align: center; border-bottom: 2px dashed #999; padding-bottom: 12px; margin-bottom: 12px; }
        
        /* Logo un poco más grande en la boleta */
        .boleta-logo { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto 8px; padding: 0; }
        
        .boleta-head h2 { margin: 0; font-size: 18px; font-family: 'Inter', sans-serif; }
        .boleta-head p { margin: 2px 0; font-size: 12px; color: #555; font-family: 'Inter', sans-serif; }
        .boleta-num { font-size: 13px; font-weight: bold; margin-top: 6px; }
        .boleta-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px dotted #ddd; }
        .boleta-row .k { color: #555; }
        .boleta-row .v { font-weight: bold; text-align: right; max-width: 60%; word-break: break-all; }
        .boleta-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-top: 14px; padding-top: 10px; border-top: 2px solid #111; }
        .boleta-foot { text-align: center; font-size: 11px; color: #777; margin-top: 18px; border-top: 1px dashed #999; padding-top: 10px; }
        .boleta-foot .vendedor { font-size: 12px; color: #111; font-weight: bold; margin-top: 6px; }
        
        .btn-volver { display: block; width: 100%; text-align: center; margin-top: 20px; padding: 12px; background: #e2e8f0; color: #0f172a; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; transition: 0.2s; }
        .btn-volver:hover { background: #cbd5e1; }

        @media (max-width: 600px) {
            .auth-card, .boleta-card { padding: 20px; }
            .boleta-row { flex-direction: column; align-items: flex-start; }
            .boleta-row .v { text-align: left; max-width: 100%; margin-top: 2px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Sección 1: Validación DNI (para QR o búsqueda general) -->
    <div id="authSection" class="auth-card">
        <img src="imagenes/logo.png" alt="Logo" class="main-logo">
        <h1>Consulta tus Boletas</h1>
        <p>Ingresa tu DNI para ver tus compras.</p>
        <input type="text" id="inputDni" placeholder="Ej. 12345678" maxlength="8" inputmode="numeric" oninput="this.value = this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter') validarDni()" />
        <button onclick="validarDni()">Consultar</button>
        <div id="errorMsg" class="error-msg">El DNI no coincide con ninguna compra.</div>
    </div>

    <!-- Sección 2: Lista de Boletas (Si tiene varias) -->
    <div id="listSection" class="list-card">
        <h2>Tus Compras</h2>
        <div id="listaCompras"></div>
        <button class="btn-volver" onclick="volverAlInicio()">← Buscar otro DNI</button>
    </div>

    <!-- Sección 3: Boleta Individual -->
    <div id="boletaSection" class="boleta-card">
        <div id="boletaContent"></div>
        <button class="btn-volver" onclick="volverAlInicio()">← Volver</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://dbewulhcbhgfwlchirjg.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiZXd1bGhjYmhnZndsY2hpcmpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTg3MTEsImV4cCI6MjEwNzgzNDcxMX0.ia2nN9AST_wyq8JykP0xPBMoICXc0U33k72uAPBCy6U';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const params = new URLSearchParams(window.location.search);
    const ventaIdQR = params.get('id'); // Si viene del QR
    const correlativoQR = params.get('corr') || 'Digital';

    const fmtMoney = (n) => 'S/ ' + Number(n || 0).toFixed(2);
    const fmtDate = (d) => new Date(d).toLocaleDateString('es-PE', { year:'numeric', month:'short', day:'numeric' });

    // 1. Lógica principal al cargar
    function volverAlInicio() {
        // Redirige a la URL base de la página sin parámetros, arreglando el error 404
        window.location.href = window.location.pathname; 
    }

    async function validarDni() {
        const dni = document.getElementById('inputDni').value.trim();
        const err = document.getElementById('errorMsg');
        
        if (dni.length !== 8) {
            err.textContent = 'Por favor, ingresa un DNI válido de 8 dígitos.';
            err.style.display = 'block';
            return;
        }

        err.style.display = 'none';
        document.getElementById('authSection').style.display = 'none';

        // CASO A: Venimos de un QR (Buscar solo esa boleta)
        if (ventaIdQR) {
            const { data, error } = await sb.rpc('consultar_boleta_por_dni', { p_venta_id: ventaIdQR, p_dni: dni });
            
            if (error || !data || data.length === 0) {
                document.getElementById('authSection').style.display = 'block';
                err.textContent = 'El DNI no coincide con el comprador de esta boleta.';
                err.style.display = 'block';
                return;
            }
            mostrarBoleta(data[0], correlativoQR);
        } 
        // CASO B: Búsqueda general (Listar todas sus compras)
        else {
            const { data, error } = await sb.rpc('consultar_compras_por_dni', { p_dni: dni });
            
            if (error || !data || data.length === 0) {
                document.getElementById('authSection').style.display = 'block';
                err.textContent = 'No se encontraron compras registradas con este DNI.';
                err.style.display = 'block';
                return;
            }

            if (data.length === 1) {
                // Si solo tiene 1, la mostramos directo
                mostrarBoleta(data[0], 'Digital');
            } else {
                // Si tiene varias, mostramos la lista
                mostrarLista(data);
            }
        }
    }

    // 2. Mostrar Lista de Compras
    function mostrarLista(compras) {
        document.getElementById('listSection').style.display = 'block';
        document.getElementById('listaCompras').innerHTML = compras.map((c, index) => `
            <div class="venta-item" onclick="verBoletaDeLista(${index})">
                <div class="venta-info">
                    <strong>${c.producto_nombre}</strong>
                    <span>${fmtDate(c.fecha_venta)}</span>
                </div>
                <div class="venta-precio">${fmtMoney(c.precio_venta)}</div>
            </div>
        `).join('');

        // Guardamos temporalmente los datos para no volver a consultar
        window._comprasActuales = compras;
    }

    function verBoletaDeLista(index) {
        const compra = window._comprasActuales[index];
        document.getElementById('listSection').style.display = 'none';
        
        // Para mostrar los detalles completos (licencia, etc.), volvemos a consultar la boleta específica
        // Como ya validamos el DNI antes, pasamos el DNI del input
        const dni = document.getElementById('inputDni').value.trim();
        
        sb.rpc('consultar_boleta_por_dni', { p_venta_id: compra.id, p_dni: dni }).then(({data, error}) => {
            if (!error && data.length > 0) {
                mostrarBoleta(data[0], 'Digital');
            }
        });
    }

    // 3. Mostrar Boleta Individual (Render)
    function mostrarBoleta(v, correlativo) {
        document.getElementById('boletaSection').style.display = 'block';
        
        const lineas = [];
        if (v.cliente_dni) lineas.push(`<div class="boleta-row"><span class="k">DNI:</span><span class="v">${v.cliente_dni}</span></div>`);
        lineas.push(`<div class="boleta-row"><span class="k">Cliente:</span><span class="v">${v.cliente_nombre}</span></div>`);
        lineas.push(`<div class="boleta-row"><span class="k">Producto:</span><span class="v">${v.producto_nombre}</span></div>`);
        lineas.push(`<div class="boleta-row"><span class="k">Versión:</span><span class="v">${v.producto_version || '—'}</span></div>`);
        
        const tipoLabel = v.incluye_servicio ? 'Licencia e Instalación' : v.tipo_licencia;
        lineas.push(`<div class="boleta-row"><span class="k">Tipo:</span><span class="v">${tipoLabel}</span></div>`);

        if (v.licencia_clave) lineas.push(`<div class="boleta-row"><span class="k">Licencia:</span><span class="v">${v.licencia_clave}</span></div>`);
        if (v.licencia_correo) lineas.push(`<div class="boleta-row"><span class="k">Correo Lic.:</span><span class="v">${v.licencia_correo}</span></div>`);

        document.getElementById('boletaContent').innerHTML = `
            <div class="boleta-head">
                <img src="imagenes/logo_boleta.png" alt="Logo" class="boleta-logo">
                <h2>Silicon Ventas</h2>
                <p>Servicios informáticos y licencias de software</p>
                <p class="boleta-num">Boleta N° ${correlativo}</p>
                <p>Fecha: ${fmtDate(v.fecha_venta)}</p>
            </div>
            ${lineas.join('')}
            <div class="boleta-total"><span>TOTAL</span><span>${fmtMoney(v.precio_venta)}</span></div>
            <div class="boleta-foot">
                <p>Gracias por su compra</p>
                <p>Documento virtual — no válido como comprobante fiscal</p>
                <div class="vendedor">Vendedor: Juan Carlos Condor Irigoin</div>
                <div class="vendedor">Celular: 988932324</div>
            </div>
        `;
    }
</script>
</body>
</html>
